[package]
name = "btc-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
secp256k1 = "0.29"
sha2 = { version = "0.10", features = ["asm"] }
ripemd = "0.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rustc-hash = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
